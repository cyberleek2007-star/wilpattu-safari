<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wilpattu Admin | Elishah Rides</title><link rel="stylesheet" href="styles.css"><style>
.admin-main{padding:40px 0 80px}.admin-login{max-width:560px;margin:90px auto;background:linear-gradient(145deg,#0f1e15,#09120d);border:1px solid var(--line);border-radius:28px;padding:36px;box-shadow:var(--shadow)}.admin-layout{display:grid;grid-template-columns:230px 1fr;gap:22px}.admin-nav{background:#09130d;border:1px solid var(--line);border-radius:22px;padding:12px;height:max-content;position:sticky;top:25px}.admin-nav button{width:100%;padding:13px 15px;background:none;border:0;color:#d8d5cb;text-align:left;border-radius:12px;cursor:pointer}.admin-nav button:hover,.admin-nav button.active{background:rgba(199,164,91,.13);color:var(--gold2)}.admin-card{background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:22px;padding:25px;margin-bottom:18px}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.admin-stat{background:#09130d;border:1px solid var(--line);border-radius:17px;padding:20px}.admin-stat strong{display:block;font:500 32px "Playfair Display",serif;color:var(--gold2)}.admin-stat span{font-size:11px;color:var(--muted)}.review-row,.booking-row{display:grid;grid-template-columns:100px 1fr auto;gap:16px;align-items:center;padding:15px 0;border-top:1px solid var(--line)}.review-row img{width:100px;height:75px;object-fit:cover;border-radius:10px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(199,164,91,.12);color:var(--gold2);font-size:10px}.danger{border-color:rgba(255,110,100,.3)!important;color:#ffaaa2!important}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.small-btn{padding:9px 12px;border:1px solid var(--line);background:#0b1710;color:#eee;border-radius:10px;cursor:pointer}.small-btn:hover{border-color:var(--gold2)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.field input,.field select,.field textarea{background:#09130d;color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.media-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.media-item{background:#09130d;border:1px solid var(--line);border-radius:16px;padding:14px}.media-item video{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#000}.note{color:var(--muted);font-size:13px}.status-ok{color:#9ee3b0}.status-bad{color:#ffaaa2}.login-msg{margin-top:12px;min-height:20px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center}.topline h2{margin:0}.simple-list-row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-top:1px solid var(--line)}@media(max-width:850px){.admin-layout{grid-template-columns:1fr}.admin-nav{position:static;display:grid;grid-template-columns:repeat(2,1fr)}.admin-stats{grid-template-columns:repeat(2,1fr)}.media-grid{grid-template-columns:1fr}.review-row,.booking-row{grid-template-columns:75px 1fr}.review-row .admin-actions,.booking-row .admin-actions{grid-column:1/-1}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body class="admin"><div class="admin-top"><div class="container nav-row"><div class="brand"><img src="assets/elishah-rides-logo.png" alt="Elishah Rides"><span><strong>WILPATTU ADMIN</strong><small>ELISHAH RIDES · COMMAND CENTER</small></span></div><a class="btn secondary" href="index.html">View website</a></div></div><div class="container admin-main">
<section id="login" class="admin-login"><div class="kicker">Secure admin access</div><h2>Safari command center.</h2><p style="color:var(--muted)">Sign in with the Wilpattu admin email and password.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field" style="margin-top:12px"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="margin-top:16px;width:100%">Enter dashboard →</button><div id="loginMsg" class="login-msg"></div></form></section>
<section id="dashboard" style="display:none"><div class="admin-layout"><aside class="admin-nav"><button class="active" data-page="overview">Dashboard</button><button data-page="bookings">Bookings</button><button data-page="stories">Customer stories</button><button data-page="videos">Safari videos</button><button data-page="packages">Packages</button><button id="logout">Sign out</button></aside><main id="content"></main></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
let sb=null;
const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
async function init(){await window.supabaseConfigReady;const cfg=window.supabaseConfig||{};if(!cfg.url||!cfg.anonKey)throw new Error('Supabase configuration is missing.');sb=window.supabase.createClient(cfg.url,cfg.anonKey);const {data:{session}}=await sb.auth.getSession();if(session)await enterIfAdmin(session.user);}
async function enterIfAdmin(user){const {data,error}=await sb.from('admin_users').select('user_id,role').eq('user_id',user.id).maybeSingle();if(error||!data||data.role!=='admin'){await sb.auth.signOut();return false}$('#login').style.display='none';$('#dashboard').style.display='block';await overview();return true}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const m=$('#loginMsg');m.textContent='';m.className='login-msg';try{const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)throw error;if(!(await enterIfAdmin(data.user)))throw new Error('This account is not an authorized Wilpattu admin.');}catch(err){m.textContent=err.message||'Login failed.';m.className='login-msg status-bad'}});
$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
document.querySelectorAll('.admin-nav button[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.admin-nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');window[b.dataset.page]()});
async function overview(){const [b,s,v]=await Promise.all([sb.from('safari_bookings').select('id,status',{count:'exact',head:true}),sb.from('traveller_stories').select('id,status'),sb.from('safari_videos').select('id,status')]);const stories=s.data||[],videos=v.data||[];const bookingsCount=b.count||0;const pending=stories.filter(x=>x.status==='pending').length;const published=videos.filter(x=>x.status==='published').length;$('#content').innerHTML=`<div class="admin-card"><div class="kicker">Command center</div><h2>Everything clear at a glance.</h2><div class="admin-stats"><div class="admin-stat"><strong>${bookingsCount}</strong><span>Total safari bookings</span></div><div class="admin-stat"><strong>${pending}</strong><span>Stories awaiting review</span></div><div class="admin-stat"><strong>${published}</strong><span>Published videos</span></div><div class="admin-stat"><strong>3</strong><span>Safari packages</span></div></div></div><div class="admin-card"><div class="kicker">Connection</div><p class="status-ok">✓ Supabase connected · Admin authenticated</p><p class="note">This command center is connected to the same Wilpattu Supabase project used by the website.</p></div>`}
async function bookings(){const {data,error}=await sb.from('safari_bookings').select('*').order('created_at',{ascending:false});if(error){$('#content').innerHTML=`<div class="admin-card"><h2>Bookings</h2><p class="status-bad">${esc(error.message)}</p></div>`;return}const a=data||[];$('#content').innerHTML=`<div class="admin-card"><div class="topline"><div><div class="kicker">Booking management</div><h2>Safari bookings</h2></div><button class="small-btn" onclick="bookings()">Refresh</button></div>${a.length?a.map(x=>`<div class="booking-row"><div><span class="pill">${esc(x.status||'pending')}</span></div><div><b>${esc(x.reference||x.id)}</b><p>${esc(x.customer_name)} · ${esc(x.whatsapp)}</p><p class="note">${esc(x.experience)} · ${esc(x.safari_date)} · ${esc(x.guests)} guest(s)</p><p class="note">Pickup: ${esc(x.pickup||'—')}</p>${x.notes?`<p class="note">Notes: ${esc(x.notes)}</p>`:''}</div><div class="admin-actions"><button class="small-btn" onclick="setBooking('${x.id}','confirmed')">✓ Accept</button><button class="small-btn" onclick="setBooking('${x.id}','completed')">Complete</button><button class="small-btn danger" onclick="deleteBooking('${x.id}')">Delete</button><a class="small-btn" target="_blank" href="https://wa.me/${String(x.whatsapp||'').replace(/\\D/g,'')}" rel="noopener">WhatsApp</a></div></div>`).join(''):'<p class="note">No safari bookings yet.</p>'}</div>`}
async function setBooking(id,status){const {error}=await sb.from('safari_bookings').update({status}).eq('id',id);if(error)alert(error.message);else bookings()}
async function deleteBooking(id){if(!confirm('Delete this booking?'))return;const {error}=await sb.from('safari_bookings').delete().eq('id',id);if(error)alert(error.message);else bookings()}
async function stories(){const {data,error}=await sb.from('traveller_stories').select('*').order('created_at',{ascending:false});if(error){$('#content').innerHTML=`<div class="admin-card"><h2>Customer stories</h2><p class="status-bad">${esc(error.message)}</p></div>`;return}const a=data||[];$('#content').innerHTML=`<div class="admin-card"><div class="kicker">Traveller moderation</div><h2>Customer stories</h2><p class="note">Approve ratings, comments and photos before they appear publicly.</p>${a.length?a.map(x=>{const photo=x.photo_path?sb.storage.from('traveller-stories').getPublicUrl(x.photo_path).data.publicUrl:'';return `<div class="review-row"><div>${photo?`<img src="${esc(photo)}" alt="Traveller photo">`:'<div class="note">No photo</div>'}</div><div><b>${esc(x.name)}</b><div style="color:var(--gold2);letter-spacing:2px">${'★★★★★'.split('').map((_,i)=>i<Number(x.rating)?'★':'☆').join('')}</div><p class="note">${esc(x.comment)}</p><span class="pill">${esc(x.status)}</span></div><div class="admin-actions">${x.status!=='approved'?`<button class="small-btn" onclick="storyStatus('${x.id}','approved')">✓ Accept</button>`:''}${x.status!=='rejected'?`<button class="small-btn" onclick="storyStatus('${x.id}','rejected')">Reject</button>`:''}<button class="small-btn danger" onclick="storyDelete('${x.id}')">Delete</button></div></div>`}).join(''):'<p class="note">No customer stories submitted yet.</p>'}</div>`}
async function storyStatus(id,status){const {error}=await sb.from('traveller_stories').update({status}).eq('id',id);if(error)alert(error.message);else stories()}
async function storyDelete(id){if(!confirm('Delete this customer story?'))return;const {data}=await sb.from('traveller_stories').select('photo_path').eq('id',id).maybeSingle();const {error}=await sb.from('traveller_stories').delete().eq('id',id);if(error){alert(error.message);return}if(data?.photo_path)await sb.storage.from('traveller-stories').remove([data.photo_path]);stories()}
async function videos(){const {data,error}=await sb.from('safari_videos').select('*').order('created_at',{ascending:false});if(error){$('#content').innerHTML=`<div class="admin-card"><h2>Safari videos</h2><p class="status-bad">${esc(error.message)}</p></div>`;return}const a=data||[];$('#content').innerHTML=`<div class="admin-card"><div class="kicker">Media studio</div><h2>Safari video library</h2><form id="videoForm"><div class="form-grid"><div class="field"><label>Video title</label><input name="title" required></div><div class="field"><label>Video URL</label><input name="video_url" placeholder="https://..."></div><div class="field full"><label>Or upload MP4/WebM</label><input name="file" type="file" accept="video/mp4,video/webm,video/quicktime"></div></div><button class="btn primary" style="margin-top:15px">Publish video →</button><span id="videoMsg" class="note"></span></form></div><div class="admin-card"><div class="kicker">Published videos</div><div class="media-grid">${a.length?a.map(x=>`<div class="media-item"><video controls src="${esc(x.video_url)}"></video><h3>${esc(x.title)}</h3><span class="pill">${esc(x.status)}</span><button class="small-btn danger" style="margin-top:10px" onclick="videoDelete('${x.id}')">Delete</button></div>`).join(''):'<p class="note">No videos yet.</p>'}</div></div>`;$('#videoForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),file=f.get('file'),title=String(f.get('title')||'').trim();let url=String(f.get('video_url')||'').trim();if(file&&file.size){const path=`published/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('safari-videos').upload(path,file,{upsert:false});if(up.error){$('#videoMsg').textContent=up.error.message;return}url=sb.storage.from('safari-videos').getPublicUrl(path).data.publicUrl}if(!url){$('#videoMsg').textContent='Choose a file or enter a URL.';return}const {error}=await sb.from('safari_videos').insert({title,video_url:url,status:'published'});if(error){$('#videoMsg').textContent=error.message;return}videos()}}
async function videoDelete(id){if(!confirm('Delete this video?'))return;const {data}=await sb.from('safari_videos').select('video_url').eq('id',id).maybeSingle();const {error}=await sb.from('safari_videos').delete().eq('id',id);if(error){alert(error.message);return}if(data?.video_url?.includes('/storage/v1/object/public/safari-videos/')){const path=data.video_url.split('/storage/v1/object/public/safari-videos/')[1];await sb.storage.from('safari-videos').remove([path])}videos()}
function packages(){$('#content').innerHTML=`<div class="admin-card"><div class="kicker">Safari packages</div><h2>Published experiences</h2><div class="simple-list-row"><span><b>Half-Safari (Morning)</b><br>6:00 AM – 10:00 AM · 4 hours · Breakfast included</span><b>Per person</b></div><div class="simple-list-row"><span><b>Half-Safari (Evening)</b><br>2:00 PM – 6:00 PM · 4 hours</span><b>Per person</b></div><div class="simple-list-row"><span><b>Full Safari</b><br>Full safari · Park entry ticket purchased separately</span><b>Per person</b></div><p class="note">Prices remain pending until you set the final package prices.</p></div>`}
init().catch(e=>{$('#loginMsg').textContent=e.message||'Unable to connect to Supabase.'});
</script></body></html>
