<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wilpattu Admin | Elishah Rides</title><link rel="stylesheet" href="styles.css"><style>
.admin-main{padding:40px 0 80px}.admin-login{max-width:560px;margin:90px auto;background:linear-gradient(145deg,#0f1e15,#09120d);border:1px solid var(--line);border-radius:28px;padding:36px;box-shadow:var(--shadow)}.admin-layout{display:grid;grid-template-columns:230px 1fr;gap:22px}.admin-nav{background:#09130d;border:1px solid var(--line);border-radius:22px;padding:12px;height:max-content;position:sticky;top:25px}.admin-nav button{width:100%;padding:13px 15px;background:none;border:0;color:#d8d5cb;text-align:left;border-radius:12px;cursor:pointer}.admin-nav button:hover,.admin-nav button.active{background:rgba(199,164,91,.13);color:var(--gold2)}.admin-card{background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:22px;padding:25px;margin-bottom:18px}.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.admin-stat{background:#09130d;border:1px solid var(--line);border-radius:17px;padding:20px}.admin-stat strong{display:block;font:500 32px "Playfair Display",serif;color:var(--gold2)}.admin-stat span{font-size:11px;color:var(--muted)}.media-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.media-item{background:#09130d;border:1px solid var(--line);border-radius:16px;padding:14px}.media-item video{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#000}.review-row{display:grid;grid-template-columns:100px 1fr auto;gap:16px;align-items:center;padding:15px 0;border-top:1px solid var(--line)}.review-row img{width:100px;height:75px;object-fit:cover;border-radius:10px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(199,164,91,.12);color:var(--gold2);font-size:10px}.danger{border-color:rgba(255,110,100,.3)!important;color:#ffaaa2!important}@media(max-width:850px){.admin-layout{grid-template-columns:1fr}.admin-nav{position:static;display:grid;grid-template-columns:repeat(2,1fr)}.admin-stats{grid-template-columns:repeat(2,1fr)}.media-grid{grid-template-columns:1fr}.review-row{grid-template-columns:75px 1fr}.review-row .admin-actions{grid-column:1/-1}}
</style></head><body class="admin"><div class="admin-top"><div class="container nav-row"><div class="brand"><img src="assets/elishah-rides-logo.png" alt="Elishah Rides"><span><strong>WILPATTU ADMIN</strong><small>ELISHAH RIDES · COMMAND CENTER</small></span></div><a class="btn secondary" href="index.html">View website</a></div></div>
<div class="container admin-main">
<div id="login" class="admin-login"><div class="kicker">Passwordless admin access</div><h2>Safari command center.</h2><p style="color:var(--muted)">Enter your admin email. We will send you a secure sign-in link.</p><div class="field"><label>Admin email</label><input id="adminEmail" type="email" autocomplete="email" placeholder="admin@example.com" required></div><button class="btn primary" id="loginBtn" style="margin-top:15px">Send secure login link →</button><p id="loginMsg" style="color:#ffb0a8"></p></div>
<div id="dashboard" style="display:none"><div class="admin-layout"><aside class="admin-nav">
<button class="active" onclick="go(this,overview)">Dashboard</button><button onclick="go(this,bookings)">Bookings</button><button onclick="go(this,reviews)">Customer stories</button><button onclick="go(this,videos)">Videos / Media</button><button onclick="go(this,packages)">Packages</button><button onclick="logout()">Sign out</button>
</aside><main id="content"></main></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="media.js"></script><script>
let supabaseClient=null;
const c=document.getElementById('content');
const esc=(typeof safeText==='function')?safeText:(v)=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');

async function initSupabase(){
  await window.supabaseConfigReady;
  const cfg=window.supabaseConfig||{};
  if(!cfg.url||!cfg.anonKey) throw new Error('Supabase configuration is missing.');
  supabaseClient=window.supabase.createClient(cfg.url,cfg.anonKey);
  window.supabaseClient=supabaseClient;
}

async function openExistingAdminSession(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session) return false;
  const {data:admin,error}=await supabaseClient.from('admin_users')
    .select('user_id,role').eq('user_id',session.user.id).maybeSingle();
  if(error || !admin || admin.role!=='admin'){
    await supabaseClient.auth.signOut();
    return false;
  }
  document.getElementById('login').style.display='none';
  document.getElementById('dashboard').style.display='block';
  overview();
  return true;
}
const c=document.getElementById('content'),esc=safeText;
const packs=[['Half-Safari (Morning)','6:00 AM – 10:00 AM','4 hours'],['Half-Safari (Evening)','2:00 PM – 6:00 PM','4 hours'],['Full Safari','Morning – Evening','Full safari']];
function bd(){return JSON.parse(localStorage.getItem('wilpattuBookings')||'[]')}
function save(a){localStorage.setItem('wilpattuBookings',JSON.stringify(a))}
function go(b,f){document.querySelectorAll('.admin-nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');f()}
function overview(){const a=bd(),p=a.filter(x=>x.status==='Pending').length,q=a.filter(x=>x.status==='Confirmed').length;c.innerHTML=`<div class="admin-card"><div class="kicker">Command center</div><h2>Everything clear at a glance.</h2><div class="admin-stats"><div class="admin-stat"><strong>${a.length}</strong><span>Total bookings</span></div><div class="admin-stat"><strong>${p}</strong><span>Needs attention</span></div><div class="admin-stat"><strong>${q}</strong><span>Confirmed</span></div><div class="admin-stat"><strong>3</strong><span>Packages</span></div></div></div><div class="admin-card"><div class="kicker">Quick actions</div><div class="admin-actions"><button class="small-btn" onclick="bookings()">Open bookings</button><button class="small-btn" onclick="reviews()">Review customer stories</button><button class="small-btn" onclick="videos()">Upload safari video</button></div></div>`}
function bookings(){const a=bd();c.innerHTML='<div class="admin-card"><div class="kicker">Booking management</div><h2>Safari orders</h2><p style="color:var(--muted)">Accept, complete, message or delete each request.</p></div>'+(a.length?a.map(x=>`<div class="admin-card"><div class="section-head"><div><span class="pill">${esc(x.status)}</span><h3>${esc(x.id)}</h3><p>${esc(x.name)} · ${esc(x.whatsapp)}</p></div><div class="admin-actions"><button class="small-btn" onclick="status('${esc(x.id)}','Confirmed')">✓ Accept</button><button class="small-btn" onclick="status('${esc(x.id)}','Completed')">Complete</button><button class="small-btn danger" onclick="removeBooking('${esc(x.id)}')">Delete</button></div></div><div class="simple-list-row"><span><b>${esc(x.package)}</b><br>${esc(x.date)} · ${esc(x.guests)} guest(s)</span><span>${esc(x.pickup)}</span></div>${x.notes?`<p style="color:var(--muted)">Notes: ${esc(x.notes)}</p>`:''}<a class="btn secondary" target="_blank" href="https://wa.me/${String(x.whatsapp).replace(/\\D/g,'')}">WhatsApp guest →</a></div>`).join(''):'<div class="note">No booking requests yet.</div>');}
function status(id,s){const a=bd(),x=a.find(v=>v.id===id);if(x){x.status=s;save(a);bookings()}}
function removeBooking(id){if(confirm('Delete this booking request?')){save(bd().filter(x=>x.id!==id));bookings()}}
async function reviews(){
  if(!window.supabaseClient){c.innerHTML='<div class="note">Supabase is not connected.</div>';return}
  const sb=window.supabaseClient;
  const {data,error}=await sb.from('traveller_stories').select('id,name,rating,comment,photo_path,status,created_at').order('created_at',{ascending:false});
  if(error){c.innerHTML=`<div class="admin-card"><h2>Customer stories</h2><p class="note">${esc(error.message)}</p></div>`;return}
  const a=data||[];
  c.innerHTML=`<div class="admin-card"><div class="kicker">Traveller moderation</div><h2>Customer stories</h2><p style="color:var(--muted)">Review guest ratings, comments and photos before they appear publicly.</p>${a.length?a.map(x=>{const photo=x.photo_path?sb.storage.from('traveller-stories').getPublicUrl(x.photo_path).data.publicUrl:'';return `<div class="review-row">${photo?`<img src="${esc(photo)}" alt="Traveller photo">`:'<div class="note">No photo</div>'}<div><b>${esc(x.name)}</b><div style="color:var(--gold2);letter-spacing:2px">${'★★★★★'.split('').map((_,i)=>i<Number(x.rating)?'★':'☆').join('')}</div><p style="color:var(--muted)">${esc(x.comment)}</p><span class="pill">${esc(x.status)}</span></div><div class="admin-actions">${x.status!=='approved'?`<button class="small-btn" onclick="reviewStatus('${x.id}','approved')">✓ Accept</button>`:''}${x.status!=='rejected'?`<button class="small-btn" onclick="reviewStatus('${x.id}','rejected')">Reject</button>`:''}<button class="small-btn danger" onclick="reviewDelete('${x.id}')">Delete</button></div></div>`}).join(''):'<div class="note">No customer stories submitted yet.</div>'}</div>`;
}
async function reviewStatus(id,s){
  const {error}=await window.supabaseClient.from('traveller_stories').update({status:s}).eq('id',id);
  if(error){alert(error.message);return}
  reviews();
}
async function reviewDelete(id){
  if(!confirm('Delete this customer story?'))return;
  const {data}=await window.supabaseClient.from('traveller_stories').select('photo_path').eq('id',id).maybeSingle();
  const {error}=await window.supabaseClient.from('traveller_stories').delete().eq('id',id);
  if(error){alert(error.message);return}
  if(data?.photo_path) await window.supabaseClient.storage.from('traveller-stories').remove([data.photo_path]);
  reviews();
}
async function videos(){const a=await allMedia('media');c.innerHTML=`<div class="admin-card"><div class="kicker">Media studio</div><h2>Safari video library.</h2><p style="color:var(--muted)">Upload a real video file or paste a hosted video URL.</p><form id="videoForm"><div class="form-grid"><div class="field"><label>Video title</label><input id="videoTitle" required placeholder="Morning safari in Wilpattu"></div><div class="field"><label>Video file</label><input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime"></div><div class="field full"><label>Hosted video URL (optional)</label><input id="videoUrl" placeholder="https://..."></div></div><div class="form-actions"><button class="btn primary">Publish video →</button></div><div class="success" id="videoMsg"></div></form></div><div class="admin-card"><div class="kicker">Published videos</div><div class="media-grid">${a.length?a.map(x=>`<div class="media-item"><video controls src="${x.src}"></video><h3>${esc(x.title)}</h3><div class="admin-actions"><span class="pill">${esc(x.status)}</span><button class="small-btn danger" onclick="videoDelete(${x.id})">Delete</button></div></div>`).join(''):'<div class="note">No videos yet.</div>'}</div></div>`;document.getElementById('videoForm').onsubmit=async e=>{e.preventDefault();const f=document.getElementById('videoFile').files[0],u=document.getElementById('videoUrl').value.trim();if(!f&&!u){document.getElementById('videoMsg').textContent='Choose a video file or enter a video URL.';return}const item={title:document.getElementById('videoTitle').value.trim(),kind:'video',src:f?await readFileData(f):u,status:'published',createdAt:new Date().toISOString()};await putMedia('media',item);videos()}}
async function videoDelete(id){if(confirm('Delete this video?')){await delMedia('media',id);videos()}}
function packages(){c.innerHTML=`<div class="admin-card"><div class="kicker">Package control</div><h2>Published safari packages</h2>${packs.map(p=>`<div class="admin-card" style="background:#0a130e"><b>${p[0]}</b><div class="simple-list-row"><span>${p[1]} · ${p[2]}</span><b>PRICE PENDING</b></div></div>`).join('')}<div class="note">Prices are per person. Park entry tickets are excluded.</div></div>`}
async function logout(){if(window.supabaseClient) await window.supabaseClient.auth.signOut();location.reload()}
async function adminLogin(){
  const msg=document.getElementById('loginMsg'); msg.textContent='';
  try{
    if(!supabaseClient) await initSupabase();
    const email=document.getElementById('adminEmail').value.trim();
    if(!email) throw new Error('Enter your admin email.');
    const {error}=await supabaseClient.auth.signInWithOtp({
      email,
      options:{emailRedirectTo:window.location.origin + '/admin.html'}
    });
    if(error) throw error;
    msg.style.color='var(--gold2)';
    msg.textContent='Secure login link sent. Check your email.';
  }catch(err){ console.error(err); msg.textContent=err.message||'Unable to send login link.'; }
}
document.getElementById('loginBtn').onclick=adminLogin;
(async()=>{
  try{
    await initSupabase();
    await openExistingAdminSession();
  }catch(err){
    console.error(err);
    document.getElementById('loginMsg').textContent=err.message||'Unable to connect to Supabase.';
  }
})();
</script></body></html>
