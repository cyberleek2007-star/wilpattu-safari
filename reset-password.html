<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Admin Password | Wilpattu Safari</title><link rel="stylesheet" href="styles.css"><style>
body{min-height:100vh;display:grid;place-items:center;background:#050806;color:#f4f0e7}.reset-card{width:min(520px,92vw);padding:34px;border:1px solid rgba(199,164,91,.25);border-radius:24px;background:linear-gradient(145deg,#0f1e15,#09120d);box-shadow:0 24px 80px rgba(0,0,0,.45)}.reset-logo{height:52px;margin-bottom:22px}.kicker{letter-spacing:2px;color:#c7a45b;font-size:11px}.reset-card h1{font-family:Georgia,serif;font-size:36px;margin:8px 0 10px}.reset-card p{color:#aeb7af;line-height:1.6}.field{margin-top:18px}.field label{display:block;font-size:12px;color:#c9cec9;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:14px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#07100b;color:#fff;outline:none}.btn{display:inline-block;border:0;border-radius:999px;padding:13px 18px;cursor:pointer}.primary{background:#c7a45b;color:#10150f}.secondary{background:transparent;color:#e9e3d5;border:1px solid rgba(199,164,91,.35)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.msg{margin-top:15px;min-height:22px}.success{color:#b9dfb9}.error{color:#ffaaa2}.hidden{display:none}.small{font-size:12px}
</style></head><body><main class="reset-card"><img class="reset-logo" src="assets/elishah-rides-logo.png" alt="Elishah Rides"><div class="kicker">WILPATTU COMMAND CENTER</div><h1 id="title">Reset your password</h1><p id="intro">Enter your admin email and we will send a secure password-reset link.</p><section id="requestBox"><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="email" placeholder="admin@example.com"></div><div class="actions"><button id="sendBtn" class="btn primary">Send reset link →</button><a class="btn secondary" href="admin.html">Back to login</a></div></section><section id="updateBox" class="hidden"><div class="field"><label>New password</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="Choose a new password"></div><div class="field"><label>Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter it again"></div><div class="actions"><button id="updateBtn" class="btn primary">Save new password →</button></div></section><div id="msg" class="msg"></div><p class="small">Your password is handled by Supabase Auth. Do not share your password with anyone.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
let sb;
const $=id=>document.getElementById(id);
function showUpdate(){ $('requestBox').classList.add('hidden');$('updateBox').classList.remove('hidden');$('title').textContent='Create a new password';$('intro').textContent='Choose a new password for your Wilpattu Command Center account.'; }
async function init(){
 try{
  await window.supabaseConfigReady;
  const cfg=window.supabaseConfig||{};
  if(!cfg.url||!cfg.anonKey) throw new Error('Supabase configuration is missing.');
  sb=window.supabase.createClient(cfg.url,cfg.anonKey);
  const {data:{session}}=await sb.auth.getSession();
  if(session) showUpdate();
  sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session) showUpdate();});
 }catch(e){$('msg').className='msg error';$('msg').textContent=e.message||'Unable to load reset service.';}
}
$('sendBtn').onclick=async()=>{
 $('msg').className='msg';$('msg').textContent='';
 const email=$('email').value.trim();
 if(!email){$('msg').className='msg error';$('msg').textContent='Enter your admin email.';return;}
 $('sendBtn').disabled=true;
 try{
  const redirect=location.origin+location.pathname;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect});
  if(error) throw error;
  $('msg').className='msg success';$('msg').textContent='Reset email sent. Open the link in your email to choose a new password.';
 }catch(e){$('msg').className='msg error';$('msg').textContent=e.message||'Could not send reset email.';}
 $('sendBtn').disabled=false;
};
$('updateBtn').onclick=async()=>{
 $('msg').className='msg';$('msg').textContent='';
 const a=$('newPassword').value,b=$('confirmPassword').value;
 if(a.length<8){$('msg').className='msg error';$('msg').textContent='Use at least 8 characters.';return;}
 if(a!==b){$('msg').className='msg error';$('msg').textContent='Passwords do not match.';return;}
 $('updateBtn').disabled=true;
 try{
  const {error}=await sb.auth.updateUser({password:a});
  if(error) throw error;
  $('msg').className='msg success';$('msg').textContent='Password changed successfully. You can now sign in to the Admin Command Center.';
  setTimeout(()=>location.href='admin.html',1200);
 }catch(e){$('msg').className='msg error';$('msg').textContent=e.message||'Could not change password.';}
 $('updateBtn').disabled=false;
};
init();
</script></body></html>
